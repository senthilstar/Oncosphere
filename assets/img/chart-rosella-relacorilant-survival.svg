<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">ROSELLA: relacorilant + nab-paclitaxel vs nab-paclitaxel in platinum-resistant ovarian cancer</title>
<desc id="desc">Grouped horizontal bars compare median PFS, 6.5 versus 5.5 months, and final median OS, 16.0 versus 11.9 months. The forest plot shows hazard ratios with 95% confidence intervals: PFS by BICR 0.70 (0.54–0.91), interim OS 0.69 (0.52–0.92), final OS 0.65 (0.51–0.83). The vertical reference at 1.0 marks equal hazards. All estimates favour the combination.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#183c44}.heading{font-size:23px;font-weight:700}.section{font-size:21px;font-weight:700}.label{font-size:17px}.small{font-size:15px}.muted{fill:#526b70}.value{font-size:18px;font-weight:700}</style>
<rect width="1200" height="700" fill="#f7faf9"/>
<rect x="0" y="0" width="1200" height="9" fill="#126f70"/>
<text x="40" y="49" class="heading">ROSELLA: relacorilant + nab-paclitaxel vs nab-paclitaxel</text>
<text x="40" y="82" class="heading">in platinum-resistant ovarian cancer</text>
<rect x="40" y="111" width="18" height="18" rx="3" fill="#126f70"/>
<text x="68" y="126" class="label">Relacorilant + nab-paclitaxel</text>
<rect x="390" y="111" width="18" height="18" rx="3" fill="#a86b3b"/>
<text x="418" y="126" class="label">Nab-paclitaxel</text>
<rect x="30" y="157" width="554" height="444" rx="16" fill="#ffffff" stroke="#d8e5e2"/>
<rect x="604" y="157" width="566" height="444" rx="16" fill="#ffffff" stroke="#d8e5e2"/>
<text x="52" y="195" class="section">Median survival</text>
<text x="626" y="195" class="section">Hazard ratios · 95% CI</text>
<text x="626" y="221" class="small muted">Combination relative to chemotherapy alone</text>

<text x="54" y="241" class="value" text-anchor="start">PFS · BICR</text>
<rect x="54" y="260" width="170.62" height="31" rx="4" fill="#126f70"/>
<text x="233.625" y="282" class="value" text-anchor="start">6.5 mo</text>
<rect x="54" y="306" width="144.38" height="31" rx="4" fill="#a86b3b"/>
<text x="207.375" y="328" class="value" text-anchor="start">5.5 mo</text>
<text x="54" y="398" class="value" text-anchor="start">OS · final analysis</text>
<rect x="54" y="417" width="420.00" height="31" rx="4" fill="#126f70"/>
<text x="483.0" y="439" class="value" text-anchor="start">16.0 mo</text>
<rect x="54" y="463" width="312.38" height="31" rx="4" fill="#a86b3b"/>
<text x="375.375" y="485" class="value" text-anchor="start">11.9 mo</text>
<text x="54" y="565" class="small muted" text-anchor="start">Bars share a common scale in months.</text>
<line x1="670.00" y1="245" x2="670.00" y2="520" stroke="#e7eeec"/>
<text x="670.0" y="546" class="small muted" text-anchor="middle">0.4</text>
<line x1="784.00" y1="245" x2="784.00" y2="520" stroke="#e7eeec"/>
<text x="784.0" y="546" class="small muted" text-anchor="middle">0.6</text>
<line x1="898.00" y1="245" x2="898.00" y2="520" stroke="#e7eeec"/>
<text x="898.0" y="546" class="small muted" text-anchor="middle">0.8</text>
<line x1="1012.00" y1="245" x2="1012.00" y2="520" stroke="#62777b" stroke-dasharray="6 5"/>
<text x="1012.0" y="546" class="small muted" text-anchor="middle">1.0</text>
<line x1="1126.00" y1="245" x2="1126.00" y2="520" stroke="#e7eeec"/>
<text x="1126.0" y="546" class="small muted" text-anchor="middle">1.2</text>
<text x="626" y="260" class="value" text-anchor="start">PFS (BICR)</text>
<text x="1145" y="260" class="label" text-anchor="end">0.70 (0.54–0.91)</text>
<line x1="749.80" y1="285" x2="960.70" y2="285" stroke="#126f70" stroke-width="3"/>
<line x1="749.80" y1="278" x2="749.80" y2="292" stroke="#126f70" stroke-width="2"/>
