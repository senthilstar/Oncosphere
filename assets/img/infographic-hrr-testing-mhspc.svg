<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">HRR testing in newly metastatic prostate cancer</title><desc id="desc">Start ADT and arrange tissue or ctDNA HRR testing with germline testing and genetic counselling. With an HRR mutation, consider a PARP inhibitor and ARPI and monitor blood counts. Otherwise use standard ADT intensification. The TALAPRO-3 gene panel is listed.</desc><rect width="800" height="560" fill="white"/><style>text{font-family:system-ui,sans-serif;fill:#334155}.head{font-size:22px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.bold{font-weight:700}</style><text x="28" y="34" class="head" >Metastatic prostate cancer: test early</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect x="220" y="52" width="360" height="43" rx="10" fill="#f0fdfa" stroke="#99bdb8"/><text x="400.0" y="76" class="body bold" text-anchor="middle">New metastatic prostate cancer</text><path d="M400 95 L400 112" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="280" y="114" width="240" height="43" rx="10" fill="#f0fdfa" stroke="#99bdb8"/><text x="400.0" y="138" class="body bold" text-anchor="middle">Start ADT</text><path d="M400 157 L400 174" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="150" y="176" width="500" height="90" rx="10" fill="#f0fdfa" stroke="#99bdb8"/><text x="400.0" y="200" class="body bold" text-anchor="middle">HRR testing</text><text x="400.0" y="221" class="body" text-anchor="middle">Tumour tissue NGS or ctDNA</text><text x="400.0" y="242" class="body" text-anchor="middle">Germline testing + genetic counselling</text><path d="M400 266 L400 283" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="260" y="285" width="280" height="43" rx="10" fill="#f0fdfa" stroke="#99bdb8"/><text x="400.0" y="309" class="body bold" text-anchor="middle">HRR mutation found?</text><path d="M300 328 L205 355" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M500 328 L595 355" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="231" y="340" class="small bold" >Yes</text><text x="555" y="340" class="small bold" >No</text><rect x="24" y="357" width="432" height="119" rx="10" fill="#f0fdfa" stroke="#99bdb8"/><text x="240.0" y="381" class="body bold" text-anchor="middle">Consider PARPi + ARPI</text><text x="240.0" y="402" class="body" text-anchor="middle">Talazoparib + enzalutamide · TALAPRO-3</text><text x="240.0" y="423" class="body" text-anchor="middle">Niraparib + abiraterone · AMPLITUDE</text><text x="240.0" y="444" class="body" text-anchor="middle">Baseline CBC; monitor anaemia</text><rect x="480" y="357" width="296" height="119" rx="10" fill="#f1f5f9" stroke="#99bdb8"/><text x="628.0" y="381" class="body bold" text-anchor="middle">Standard ADT intensification</text><text x="628.0" y="402" class="body" text-anchor="middle">ARPI ± docetaxel</text><text x="628.0" y="423" class="body" text-anchor="middle">Individualise for fitness</text><rect x="24" y="490" width="752" height="58" rx="10" fill="#f0fdfa" stroke="#99bdb8"/><text x="400.0" y="514" class="body bold" text-anchor="middle">TALAPRO-3 panel</text><text x="400.0" y="535" class="small" text-anchor="middle">ATM · ATR · BRCA1 · BRCA2 · CDK12 · CHEK2 · FANCA · MLH1 · MRE11A · NBN · PALB2 · RAD51C</text></svg>