<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">MATTERHORN: perioperative durvalumab + FLOT in resectable gastric/GEJ cancer</title>
<desc id="desc">Treatment proceeds from diagnosis through durvalumab and FLOT before surgery, surgery, durvalumab and FLOT after surgery, and durvalumab alone. Result tiles show event-free and overall survival hazard ratios and pathological complete response; a bar chart compares pathological complete response rates.</desc>
<rect width="800" height="520" fill="white"/>
<g font-family="system-ui, sans-serif" fill="#203747">
<text x="24" y="32" font-size="19" font-weight="700">MATTERHORN: perioperative durvalumab + FLOT</text>
<text x="24" y="55" font-size="16">in resectable gastric/GEJ cancer</text>
<g fill="#f1f7f7" stroke="#d5e5e6">
<rect x="24" y="83" width="122" height="110" rx="10"/><rect x="158" y="83" width="160" height="110" rx="10"/><rect x="330" y="83" width="86" height="110" rx="10"/><rect x="428" y="83" width="160" height="110" rx="10"/><rect x="600" y="83" width="176" height="110" rx="10"/>
</g>
<g font-size="12"><text x="36" y="111" font-weight="700">Diagnosis</text><text x="36" y="132">stage II–IVA</text>
<text x="170" y="108" font-weight="700">Neoadjuvant</text><text x="170" y="128">durvalumab 1500 mg</text><text x="170" y="146">q4w + FLOT</text><text x="170" y="164">×2 cycles</text>
<text x="343" y="137" font-weight="700">Surgery</text>
<text x="440" y="108" font-weight="700">Adjuvant</text><text x="440" y="128">durvalumab + FLOT</text><text x="440" y="146">×2 cycles</text>
<text x="612" y="108" font-weight="700">Durvalumab alone</text><text x="612" y="128">q4w ×10 cycles</text></g>
<g fill="#087f80" font-size="18" font-weight="700"><text x="145" y="143">›</text><text x="317" y="143">›</text><text x="415" y="143">›</text><text x="587" y="143">›</text></g>
<g fill="#f1f7f7" stroke="#d5e5e6"><rect x="24" y="220" width="242" height="96" rx="10"/><rect x="279" y="220" width="242" height="96" rx="10"/><rect x="534" y="220" width="242" height="96" rx="10"/></g>
<g font-size="14"><text x="38" y="247" font-weight="700">EFS HR 0.71 (0.58–0.86)</text><text x="38" y="274">2-yr 67.4% vs 58.5%</text><text x="293" y="247" font-weight="700">OS HR 0.78 (0.63–0.96)</text><text x="293" y="274">final analysis</text><text x="548" y="247" font-weight="700">pCR</text><text x="548" y="274">19.2% vs 7.2%</text></g>
<text x="24" y="350" font-size="14" font-weight="700">Pathological complete response (pCR)</text>
<text x="24" y="379" font-size="12">Durvalumab + FLOT</text><text x="24" y="410" font-size="12">Placebo + FLOT</text>
<rect x="180" y="365" width="384" height="16" rx="4" fill="#087f80"/><rect x="180" y="396" width="144" height="16" rx="4" fill="#77959b"/>
<text x="575" y="378" font-size="12">19.2%</text><text x="335" y="409" font-size="12">7.2%</text>
<line x1="180" y1="425" x2="680" y2="425" stroke="#82979e"/><text x="180" y="444" font-size="11">0</text><text x="660" y="444" font-size="11">25%</text>
<text x="24" y="478" font-size="11">Sources: NEJM 2025; Lancet 2026; FDA 2025.</text>
<text x="24" y="498" font-size="11">FLOT = fluorouracil, leucovorin, oxaliplatin, docetaxel.</text>
</g></svg>
