<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">Perioperative enfortumab vedotin regimens in MIBC: three phase 3 trials</title>
<desc id="desc">Three trial cards compare event-free and overall survival, pathological complete response where available, and severe adverse events. The trials have different control arms and are not a head-to-head comparison.</desc>
<rect width="800" height="520" fill="white"/><g font-family="system-ui, sans-serif" fill="#203747">
<text x="24" y="34" font-size="20" font-weight="700">Perioperative enfortumab vedotin regimens in MIBC: three phase 3 trials</text>
<g transform="translate(24 54)"><rect width="238" height="403" rx="10" fill="#f1f7f7" stroke="#d5e5e6"/>
<text x="14" y="26" font-size="15" font-weight="700">KEYNOTE-905</text>
<text x="14" y="46" font-size="12">cisplatin-ineligible</text>
<text x="14" y="64" font-size="12">EV + pembrolizumab</text>
<text x="14" y="82" font-size="12">vs surgery alone</text>
<text x="14" y="110" font-size="12" font-weight="700">N: 170 vs 174</text>
<text x="14" y="138" font-size="12" font-weight="700">EFS HR (95% CI)</text>
<text x="14" y="156" font-size="13" fill="#087f80">0.40 (0.28–0.57)</text>
<rect x="14" y="169" width="200" height="8" rx="4" fill="#d8e5e6"/>
<rect x="14" y="169" width="80.0" height="8" rx="4" fill="#087f80"/>
<text x="14" y="193" font-size="10">0</text><text x="207" y="193" font-size="10">1</text>
<text x="14" y="219" font-size="12">2-year EFS: 74.7% vs 39.4%</text>
<text x="14" y="249" font-size="12" font-weight="700">OS HR (95% CI)</text>
<text x="14" y="267" font-size="13" fill="#087f80">0.50 (0.33–0.74)</text>
<text x="14" y="294" font-size="12">2-year OS: 79.7% vs 63.1%</text>
<text x="14" y="324" font-size="12">pCR: 57.1% vs 8.6%</text>
<text x="14" y="353" font-size="12" font-weight="700">Grade ≥3 adverse events</text>
<text x="14" y="373" font-size="12">71.3% vs 45.9%</text></g>
<g transform="translate(281 54)"><rect width="238" height="403" rx="10" fill="#f1f7f7" stroke="#d5e5e6"/>
<text x="14" y="26" font-size="15" font-weight="700">VOLGA</text>
<text x="14" y="46" font-size="12">cisplatin-ineligible</text>
<text x="14" y="64" font-size="12">durvalumab + EV</text>
<text x="14" y="82" font-size="12">vs surgery alone</text>
<text x="14" y="110" font-size="12" font-weight="700">N: 233 vs 229</text>
<text x="14" y="138" font-size="12" font-weight="700">EFS HR (95% CI)</text>
<text x="14" y="156" font-size="13" fill="#087f80">0.51 (0.38–0.67)</text>
<rect x="14" y="169" width="200" height="8" rx="4" fill="#d8e5e6"/>
<rect x="14" y="169" width="102.0" height="8" rx="4" fill="#087f80"/>
<text x="14" y="193" font-size="10">0</text><text x="207" y="193" font-size="10">1</text>
<text x="14" y="219" font-size="12">2-year EFS: 63.5% vs 45.1%</text>
<text x="14" y="249" font-size="12" font-weight="700">OS HR (95% CI)</text>
<text x="14" y="267" font-size="13" fill="#087f80">0.58 (0.40–0.83)</text>
<text x="14" y="294" font-size="12">2-year OS: 78.4% vs 69.4%</text>
<text x="14" y="353" font-size="12" font-weight="700">Grade ≥3 adverse events</text>
<text x="14" y="373" font-size="12">71.1% vs 50.2%</text></g>
<g transform="translate(538 54)"><rect width="238" height="403" rx="10" fill="#f1f7f7" stroke="#d5e5e6"/>
<text x="14" y="26" font-size="15" font-weight="700">KEYNOTE-B15</text>
<text x="14" y="46" font-size="12">cisplatin-eligible</text>
<text x="14" y="64" font-size="12">EV + pembrolizumab</text>
<text x="14" y="82" font-size="12">vs gem-cis</text>
<text x="14" y="110" font-size="12" font-weight="700">N: 405 vs 403</text>
<text x="14" y="138" font-size="12" font-weight="700">EFS HR (95% CI)</text>
<text x="14" y="156" font-size="13" fill="#087f80">0.53 (0.41–0.70)</text>
<rect x="14" y="169" width="200" height="8" rx="4" fill="#d8e5e6"/>
<rect x="14" y="169" width="106.0" height="8" rx="4" fill="#087f80"/>
<text x="14" y="193" font-size="10">0</text><text x="207" y="193" font-size="10">1</text>
<text x="14" y="219" font-size="12">2-year EFS: 79.4% vs 66.2%</text>
<text x="14" y="249" font-size="12" font-weight="700">OS HR (95% CI)</text>
<text x="14" y="267" font-size="13" fill="#087f80">0.65 (0.48–0.89)</text>
<text x="14" y="294" font-size="12">2-year OS: 86.9% vs 81.3%</text>
<text x="14" y="324" font-size="12">pCR: 55.8% vs 32.5%</text>
<text x="14" y="353" font-size="12" font-weight="700">Grade ≥3 adverse events</text>
<text x="14" y="373" font-size="12">75.7% vs 67.2%</text></g>
<text x="24" y="482" font-size="11">Sources: NEJM 2026 (KEYNOTE-905, KEYNOTE-B15, VOLGA); FDA 2025–2026.</text>
<text x="24" y="500" font-size="11">Different control arms — not a head-to-head comparison.</text></g></svg>
