<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">ATOMIC adjuvant pathway</title><desc id="desc">After resection of stage III colon cancer, MMR testing directs a standard chemotherapy pathway for proficient tumours or an atezolizumab and chemotherapy pathway for deficient tumours. Consider Lynch syndrome counselling and monitor immune effects.</desc><rect width="800" height="560" fill="white"/><g font-family="system-ui, sans-serif" fill="#203747"><text x="30" y="39" font-size="23" font-weight="700">Adjuvant pathway: test MMR</text>
<rect x="235" y="58" width="330" height="44" rx="10" fill="#e6f4f2"/><text x="400" y="85" text-anchor="middle" font-size="16" font-weight="600">Resected stage III colon cancer</text><path d="M400 102v20" stroke="#087f80" stroke-width="2"/><path d="M394 117l6 7 6-7" fill="none" stroke="#087f80" stroke-width="2"/>
<rect x="235" y="125" width="330" height="44" rx="10" fill="#d2eeea"/><text x="400" y="152" text-anchor="middle" font-size="16" font-weight="600">MMR IHC on resection specimen</text><path d="M400 169v20H200v16 M400 189h200v16" fill="none" stroke="#087f80" stroke-width="2"/>
<rect x="25" y="205" width="350" height="126" rx="10" fill="#edf2f4"/><text x="45" y="232" font-size="17" font-weight="700">pMMR</text><text x="45" y="257" font-size="14">Standard adjuvant fluoropyrimidine</text><text x="45" y="278" font-size="14">+ oxaliplatin</text><text x="45" y="307" font-size="13">ATOMIC does not apply</text>
<rect x="425" y="205" width="350" height="126" rx="10" fill="#e6f4f2"/><text x="445" y="232" font-size="17" font-weight="700">dMMR</text><text x="445" y="257" font-size="14">Atezolizumab + mFOLFOX6</text><text x="445" y="278" font-size="14">× 6 months (12 cycles), then</text><text x="445" y="302" font-size="14">atezolizumab alone 6 more months</text><text x="445" y="320" font-size="12">Total: 12 months</text>
<rect x="25" y="350" width="350" height="65" rx="9" fill="#f3f7f8"/><text x="40" y="375" font-size="14" font-weight="700">Also: germline testing /</text><text x="40" y="396" font-size="14">Lynch syndrome counselling</text><rect x="425" y="350" width="350" height="65" rx="9" fill="#f3f7f8"/><text x="440" y="375" font-size="14" font-weight="700">Watch: thyroid, colitis, liver,</text><text x="440" y="396" font-size="14">lung immune effects</text>
<text x="30" y="458" font-size="14" font-weight="700">Milestones</text><line x1="82" y1="488" x2="718" y2="488" stroke="#87aaa9" stroke-width="3"/><g fill="#087f80"><circle cx="115" cy="488" r="6"/><circle cx="400" cy="488" r="6"/><circle cx="685" cy="488" r="6"/></g><text x="115" y="515" text-anchor="middle" font-size="12">ASCO 2025</text><text x="115" y="532" text-anchor="middle" font-size="12">late-breaking</text><text x="400" y="515" text-anchor="middle" font-size="12">NEJM publication</text><text x="685" y="515" text-anchor="middle" font-size="12">FDA approval</text><text x="685" y="532" text-anchor="middle" font-size="12">8 Oct 2026</text></g></svg>