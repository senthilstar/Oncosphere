<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
<title id="title">ATOMIC disease-free and overall survival</title><desc id="desc">Three-year disease-free survival was 86.3 versus 76.2 percent and five-year overall survival was 89.7 versus 87.9 percent. Forest plot shows hazard ratios and confidence intervals; overall survival is immature and subgroups are exploratory.</desc>
<rect width="800" height="480" fill="white"/><g font-family="system-ui, sans-serif" fill="#203747"><text x="32" y="38" font-size="23" font-weight="700">ATOMIC: adjuvant treatment outcomes</text><text x="32" y="64" font-size="13">Resected stage III dMMR colon cancer</text><text x="32" y="103" font-size="16" font-weight="700">Estimated survival rates</text><text x="427" y="103" font-size="16" font-weight="700">Hazard ratio (95% CI)</text>
<rect x="33" y="120" width="12" height="12" fill="#087f80"/><text x="51" y="131" font-size="11">Atezolizumab + mFOLFOX6</text><rect x="240" y="120" width="12" height="12" fill="#8296a1"/><text x="258" y="131" font-size="11">mFOLFOX6</text>
<text x="33" y="177" font-size="13" font-weight="600">3-year DFS</text><rect x="33" y="190" width="293.4" height="27" rx="3" fill="#087f80"/><text x="331" y="209" font-size="13">86.3%</text><rect x="33" y="223" width="259.1" height="27" rx="3" fill="#8296a1"/><text x="298" y="242" font-size="13">76.2%</text>
<text x="33" y="294" font-size="13" font-weight="600">5-year OS</text><rect x="33" y="307" width="305" height="27" rx="3" fill="#087f80"/><text x="343" y="326" font-size="13">89.7%</text><rect x="33" y="340" width="298.9" height="27" rx="3" fill="#8296a1"/><text x="337" y="359" font-size="13">87.9%</text>
<line x1="613" y1="139" x2="613" y2="362" stroke="#a4b3ba" stroke-dasharray="5 4"/><line x1="463" y1="359" x2="758" y2="359" stroke="#526b78"/><text x="465" y="378" font-size="11">0</text><text x="606" y="378" font-size="11">1.0</text><text x="744" y="378" font-size="11">2.0</text>
<text x="427" y="153" font-size="12">DFS overall</text><line x1="516" y1="169" x2="573" y2="169" stroke="#087f80" stroke-width="3"/><circle cx="538" cy="169" r="5" fill="#087f80"/><text x="427" y="189" font-size="11">0.50 (0.35–0.73)</text>
<text x="427" y="218" font-size="12">DFS &gt;6 cycles · exploratory</text><line x1="504" y1="234" x2="559" y2="234" stroke="#087f80" stroke-width="3"/><circle cx="525" cy="234" r="5" fill="#087f80"/><text x="427" y="254" font-size="11">0.41 (0.27–0.64)</text>
<text x="427" y="282" font-size="12">DFS ≤6 cycles · exploratory</text><line x1="530" y1="298" x2="778" y2="298" stroke="#087f80" stroke-width="3"/><circle cx="609" cy="298" r="5" fill="#087f80"/><text x="427" y="318" font-size="11">0.97 (0.44–2.11)</text>
<text x="427" y="340" font-size="12">OS</text><line x1="546" y1="347" x2="683" y2="347" stroke="#087f80" stroke-width="3"/><circle cx="598" cy="347" r="5" fill="#087f80"/><text x="644" y="340" font-size="11">0.90 (0.55–1.47)</text>
