<title id="title">PSMAddition efficacy and safety</title><desc id="desc">Forest plot of radiographic progression-free survival and overall survival hazard ratios with confidence intervals. Updated analyses are sponsor-reported. Overall survival is immature. Side panel compares progression events and severe adverse events.</desc>
<rect width="800" height="480" fill="white"/><g font-family="system-ui, sans-serif" fill="#203747"><text x="32" y="38" font-size="23" font-weight="700">PSMAddition: efficacy and safety</text><text x="32" y="64" font-size="13">Lu-PSMA-617 + ADT/ARPI versus ADT/ARPI</text><text x="32" y="100" font-size="16" font-weight="700">Hazard ratio (95% CI)</text><line x1="400" y1="115" x2="400" y2="350" stroke="#8296a1" stroke-dasharray="5 4"/>
<text x="32" y="135" font-size="12">rPFS primary (IA2)</text><line x1="274.0" y1="148" x2="370.0" y2="148" stroke="#087f80" stroke-width="3"/><circle cx="316.0" cy="148" r="5" fill="#087f80"/><text x="32" y="154" font-size="11">0.72 (0.58–0.90)</text>
<text x="32" y="190" font-size="12">rPFS updated · sponsor-reported</text><line x1="265.0" y1="203" x2="346.0" y2="203" stroke="#087f80" stroke-width="3"/><circle cx="301.0" cy="203" r="5" fill="#087f80"/><text x="32" y="209" font-size="11">0.67 (0.55–0.82)</text>
<text x="32" y="245" font-size="12">OS interim</text><line x1="289.0" y1="258" x2="439.0" y2="258" stroke="#087f80" stroke-width="3"/><circle cx="352.0" cy="258" r="5" fill="#087f80"/><text x="32" y="264" font-size="11">0.84 (0.63–1.13)</text>
<text x="32" y="300" font-size="12">OS updated · sponsor-reported</text><line x1="289.0" y1="313" x2="403.0" y2="313" stroke="#087f80" stroke-width="3"/><circle cx="340.0" cy="313" r="5" fill="#087f80"/><text x="32" y="319" font-size="11">0.80 (0.63–1.01)</text>
<line x1="220" y1="350" x2="460" y2="350" stroke="#526b78"/><text x="214" y="370" font-size="11">0.4</text><text x="391" y="370" font-size="11">1.0</text><text x="450" y="370" font-size="11">1.2</text>
<rect x="500" y="112" width="270" height="228" rx="8" fill="#f1f7f7"/><text x="516" y="140" font-size="15" font-weight="700">Event rates</text><text x="516" y="175" font-size="13">rPFS events</text><text x="516" y="198" font-size="16" fill="#087f80">24.3% vs 30.1%</text><text x="516" y="249" font-size="13">Grade ≥3 adverse events</text><text x="516" y="272" font-size="16" fill="#087f80">50.7% vs 43.0%</text>
<text x="32" y="413" font-size="11">Sources: Lancet 2026; ESMO 2025 LBA6; FDA 31 Jul 2026;</text><text x="32" y="431" font-size="11">Novartis (updated analysis, sponsor-reported). HR &lt;1 favours Lu-PSMA-617. OS immature.</text></g></svg>