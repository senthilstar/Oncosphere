<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">ESR1 ctDNA-guided switch pathway</title><desc id="desc">First-line AI and CDK4/6 inhibitor with serial ctDNA testing, followed by camizestrant switch if ESR1 mutation is detected without radiological progression, or continued treatment and retesting if not detected. A side panel lists regulatory milestones.</desc><rect width="800" height="560" fill="white"/><g font-family="system-ui, sans-serif" fill="#243c48"><text x="28" y="38" font-size="23" font-weight="700">ESR1 ctDNA-guided switch</text><text x="28" y="61" font-size="13">SERENA-6 pathway · check the relevant local label</text>
<rect x="28" y="80" width="466" height="57" rx="10" fill="#e7f5f3"/><text x="46" y="103" font-size="16" font-weight="700">First-line AI + CDK4/6 inhibitor</text><text x="46" y="124" font-size="13">≥6 months; no progression</text>
<path d="M261 137v20" stroke="#187e7c" stroke-width="3"/><path d="M255 151l6 8 6-8" fill="none" stroke="#187e7c" stroke-width="3"/>
<rect x="28" y="162" width="466" height="48" rx="10" fill="#edf2f4"/><text x="46" y="191" font-size="16" font-weight="700">Serial ctDNA ESR1 testing</text>
<path d="M261 210v18" stroke="#187e7c" stroke-width="3"/><rect x="28" y="232" width="466" height="54" rx="10" fill="#e7f5f3"/><text x="46" y="255" font-size="15" font-weight="700">ESR1 mutation detected?</text><text x="46" y="275" font-size="13">Confirm no radiological progression</text>
<path d="M154 286v22 M378 286v22" stroke="#187e7c" stroke-width="3"/><text x="53" y="307" font-size="13" font-weight="700">DETECTED</text><text x="301" y="307" font-size="13" font-weight="700">NOT DETECTED</text>
<rect x="28" y="315" width="252" height="198" rx="10" fill="#e7f5f3"/><text x="44" y="340" font-size="14" font-weight="700">Switch AI to camizestrant</text><text x="44" y="362" font-size="13">75 mg orally daily</text><text x="44" y="386" font-size="13">Keep same CDK4/6i dose</text><text x="44" y="410" font-size="13">LHRH for pre/perimenopausal</text><text x="44" y="429" font-size="13">women and men</text><text x="44" y="455" font-size="13">Check ECG and heart rate;</text><text x="44" y="474" font-size="13">review QT-prolonging drugs</text>
<rect x="296" y="315" width="198" height="91" rx="10" fill="#edf2f4"/><text x="312" y="342" font-size="14" font-weight="700">Continue treatment</text><text x="312" y="365" font-size="13">and retest</text>
<rect x="516" y="80" width="256" height="433" rx="12" fill="#f3f7f8"/><text x="534" y="111" font-size="17" font-weight="700">Regulatory timeline</text><g font-size="13"><text x="534" y="147">BTD · May 2025</text><text x="534" y="187">NEJM / ASCO · 2025</text><text x="534" y="227">ODAC · 3–6 · 30 Apr 2026</text><text x="534" y="267">CHMP positive · 21 May 2026</text><text x="534" y="307">EU authorisation · 20 Jul 2026</text><text x="534" y="347">FDA accelerated approval</text><text x="534" y="366">4 Sep 2026</text></g><text x="534" y="425" font-size="12">OS remains immature.</text><text x="534" y="447" font-size="12">Sources: FDA, NEJM, EMA,</text><text x="534" y="465" font-size="12">AstraZeneca.</text></g></svg>